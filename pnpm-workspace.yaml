catalogMode: prefer
cleanupUnusedCatalogs: true
ignoreWorkspaceRootCheck: true
shellEmulator: true

trustPolicy: no-downgrade
packages:
  - app/*
  - packages/*

allowBuilds:
  simple-git-hooks: true

catalogs:
  dev:
    '@antfu/eslint-config': ^9.3.0
    eslint: ^10.8.0
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.13.1
    turbo: ^2.10.8
    typescript: ^6.0.3
